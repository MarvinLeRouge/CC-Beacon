name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: ["main"]

jobs:
  api-lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        working-directory: api
        run: uv sync --locked

      - name: Ruff check
        run: uv run --project api ruff check api/

      - name: Ruff format
        run: uv run --project api ruff format --check api/

      - name: Mypy
        working-directory: api
        run: uv run mypy .

  api-test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        working-directory: api
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run --project api pytest api/tests --cov=api --cov-config=api/pyproject.toml --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: backend
          fail_ci_if_error: false
          use_oidc: true

  api-security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        working-directory: api
        run: uv sync --locked

      - name: pip-audit
        run: |
          uv export --project api --format requirements-txt --no-hashes --no-emit-project > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt

  ci-status:
    name: CI status
    if: always()
    needs: [api-lint, api-test, api-security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
