default_install_hook_types: [pre-commit, post-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
      - id: ruff-format
        files: ^api/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (api)
        args: ["--config-file", "api/pyproject.toml"]
        entry: bash -c "cd api && .venv/bin/mypy ."
        language: system
        pass_filenames: false
        files: ^api/
      - id: changelog
        name: Update CHANGELOG.md (git-cliff)
        entry: bash scripts/changelog-post-commit.sh
        language: system
        stages: [post-commit]
        pass_filenames: false
        always_run: true
