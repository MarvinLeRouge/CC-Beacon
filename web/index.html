<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC-Beacon</title>
  <script src="theme-init.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Type scale — 4 tiers, replaces 7 cramped sizes that used to span
         the same range (12–20.8px, only a 1.7:1 ratio across all 7). */
      --text-xs:   .75rem;
      --text-sm:   .875rem;
      --text-base: 1rem;
      --text-lg:   1.25rem;

      --bg:        #f4f5f7;
      --surface:   #ffffff;
      --border:    #e1e4e8;
      --text:      #1a1a2e;
      --muted:     #6b7280;
      --accent:    #2563eb;
      --green:     #16a34a;
      --orange:    #b45309;
      --red:       #dc2626;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.08);
      color-scheme: light;

      /* Dark values, defined once. Referenced from both the OS-preference
         media query and the manual [data-theme="dark"] override below, so
         the two activation paths can never drift out of sync with each
         other again. */
      --dark-bg:        #111827;
      --dark-surface:   #1f2937;
      --dark-border:    #374151;
      --dark-text:      #f9fafb;
      --dark-muted:     #9ca3af;
      --dark-accent:    #60a5fa;
      --dark-green:     #4ade80;
      --dark-orange:    #fbbf24;
      --dark-red:       #f87171;
      --dark-shadow:    0 1px 3px rgba(0,0,0,.4);
      --dark-badge-pending-bg:     #374151;
      --dark-badge-pending-fg:     #d1d5db;
      --dark-badge-in-progress-bg: #1e3a5f;
      --dark-badge-in-progress-fg: #93c5fd;
      --dark-badge-done-bg:        #14532d;
      --dark-badge-done-fg:        #86efac;
      --dark-badge-error-bg:       #7f1d1d;
      --dark-badge-error-fg:       #fca5a5;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:      var(--dark-bg);
        --surface: var(--dark-surface);
        --border:  var(--dark-border);
        --text:    var(--dark-text);
        --muted:   var(--dark-muted);
        --accent:  var(--dark-accent);
        --green:   var(--dark-green);
        --orange:  var(--dark-orange);
        --red:     var(--dark-red);
        --shadow:  var(--dark-shadow);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:      var(--dark-bg);
      --surface: var(--dark-surface);
      --border:  var(--dark-border);
      --text:    var(--dark-text);
      --muted:   var(--dark-muted);
      --accent:  var(--dark-accent);
      --green:   var(--dark-green);
      --orange:  var(--dark-orange);
      --red:     var(--dark-red);
      --shadow:  var(--dark-shadow);
      color-scheme: dark;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
    }
    header h1 { font-size: var(--text-lg); font-weight: 700; flex: 1; }
    #btn-back {
      background: none;
      border: none;
      font-size: var(--text-lg);
      cursor: pointer;
      color: var(--accent);
      padding: 12px 16px 12px 0;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
    }
    #refresh-indicator {
      font-size: var(--text-xs);
      color: var(--orange);
      white-space: nowrap;
    }
    #btn-theme {
      background: none;
      border: none;
      font-size: var(--text-lg);
      cursor: pointer;
      color: var(--muted);
      padding: 12px 0 12px 12px;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
    }

    /* ── Main ── */
    main { padding: 16px; max-width: 640px; margin: 0 auto; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow .15s;
    }
    .card:active { box-shadow: 0 0 0 2px var(--accent); }
    .card[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title {
      font-size: var(--text-base);
      font-weight: 600;
      flex: 1;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .card-meta { font-size: var(--text-xs); color: var(--muted); margin-top: 4px; }
    .card-delete {
      background: none;
      border: none;
      color: var(--muted);
      font-size: var(--text-sm);
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      border-radius: 6px;
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
    }
    .card-delete:active { background: var(--border); color: var(--red); }
    .card-delete:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* ── Progress bar ── */
    .progress-wrap { margin-top: 10px; }
    .progress-label { display: flex; justify-content: flex-end; font-size: var(--text-xs); color: var(--muted); margin-bottom: 4px; }
    .progress-bar { background: var(--border); border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      width: 100%;
      border-radius: 99px;
      background: var(--accent);
      transform-origin: left;
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-fill { transition: none; }
    }
    .progress-fill.done  { background: var(--green); }
    .progress-fill.error { background: var(--red); }

    /* ── Status badge ── */
    .badge {
      display: inline-block;
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .03em;
      white-space: nowrap;
    }
    .badge-pending     { background: #e5e7eb; color: #374151; }
    .badge-in_progress { background: #dbeafe; color: #1d4ed8; }
    .badge-done        { background: #dcfce7; color: #15803d; }
    .badge-error       { background: #fee2e2; color: #b91c1c; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .badge-pending     { background: var(--dark-badge-pending-bg);     color: var(--dark-badge-pending-fg); }
      :root:not([data-theme="light"]) .badge-in_progress { background: var(--dark-badge-in-progress-bg); color: var(--dark-badge-in-progress-fg); }
      :root:not([data-theme="light"]) .badge-done        { background: var(--dark-badge-done-bg);        color: var(--dark-badge-done-fg); }
      :root:not([data-theme="light"]) .badge-error       { background: var(--dark-badge-error-bg);       color: var(--dark-badge-error-fg); }
      :root:not([data-theme="light"]) .error-banner      { background: var(--dark-badge-error-bg);       color: var(--dark-badge-error-fg); }
    }
    :root[data-theme="dark"] .badge-pending     { background: var(--dark-badge-pending-bg);     color: var(--dark-badge-pending-fg); }
    :root[data-theme="dark"] .badge-in_progress { background: var(--dark-badge-in-progress-bg); color: var(--dark-badge-in-progress-fg); }
    :root[data-theme="dark"] .badge-done        { background: var(--dark-badge-done-bg);        color: var(--dark-badge-done-fg); }
    :root[data-theme="dark"] .badge-error       { background: var(--dark-badge-error-bg);       color: var(--dark-badge-error-fg); }
    :root[data-theme="dark"] .error-banner      { background: var(--dark-badge-error-bg);       color: var(--dark-badge-error-fg); }

    /* ── Steps ── */
    .steps-toggle {
      background: none;
      border: none;
      font-size: var(--text-sm);
      color: var(--accent);
      cursor: pointer;
      margin-top: 10px;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
    }
    .steps-list {
      margin-top: 8px;
      padding-left: 4px;
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: var(--text-sm);
    }
    .step-icon { flex-shrink: 0; font-size: var(--text-sm); margin-top: 1px; color: var(--muted); }
    .step-icon[data-status="done"]        { color: var(--green); }
    .step-icon[data-status="in_progress"] { color: var(--accent); }
    .step-icon[data-status="error"]       { color: var(--red); }
    .step-label { color: var(--text); line-height: 1.3; }
    .step-at { font-size: var(--text-xs); color: var(--muted); }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      font-size: var(--text-sm);
    }
    .pagination button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      color: var(--accent);
      font-size: var(--text-sm);
      min-height: 44px;
    }
    .pagination button:disabled { color: var(--muted); cursor: default; }

    /* ── Empty / Error states ── */
    .state-empty {
      text-align: center;
      color: var(--muted);
      font-size: var(--text-sm);
      padding: 48px 16px;
    }
    .error-banner {
      background: #fee2e2;
      color: #b91c1c;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: var(--text-sm);
      margin-bottom: 12px;
    }
    .error-banner-toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      max-width: calc(100% - 32px);
      box-shadow: var(--shadow);
    }

    /* ── Token gate ── */
    .token-gate { max-width: 320px; margin: 80px auto 0; text-align: center; }
    .token-gate-label { color: var(--muted); font-size: var(--text-sm); margin-bottom: 12px; }
    .token-gate-error { color: var(--red); font-size: var(--text-sm); margin-bottom: 12px; }
    .token-gate form { display: flex; gap: 8px; }
    .token-gate input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: var(--text-sm);
    }
    .token-gate button {
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: var(--text-sm);
      cursor: pointer;
      min-height: 44px;
    }

    /* ── Confirmation sheet (replaces native confirm()) ── */
    .confirm-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }
    .confirm-sheet {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
      animation: confirm-sheet-in .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes confirm-sheet-in {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .confirm-sheet { animation: none; }
    }
    .confirm-message { font-size: var(--text-sm); line-height: 1.5; margin-bottom: 16px; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius);
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    .confirm-cancel { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .confirm-delete { background: var(--red); border: none; color: #fff; }

    /* ── Accessibility utility ── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

<header>
  <button id="btn-back" aria-label="Retour">&#8592;</button>
  <h1 id="page-title">CC-Beacon</h1>
  <span id="refresh-indicator" hidden>&#8635; live</span>
  <button id="btn-theme" aria-label="Changer de thème">&#9788;</button>
</header>
<main id="app"><p class="state-empty">Chargement…</p></main>

<script src="app.js" defer></script>
</body>
</html>
